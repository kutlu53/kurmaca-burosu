<title>Kurmaca Bürosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Special+Elite&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Gece bürosu: koyu masa üstünde dosya kâğıtları; ortada kırmızı ipli mantar pano. Tek (koyu) görünüm bilinçli seçim. */
:root{
  --desk:#141922; --desk-2:#1b222e; --line:#2d3646; --fg:#ddd7c9; --muted:#939aa7;
  --paper:#ece6d7; --paper-2:#ddd4bf; --ink:#221f1a; --ink-soft:#5d564a;
  --brass:#c9a45c; --string:#c63b2f; --ok:#8ab583; --warn:#d9a54b; --cork:#2c2620; --cork-2:#3a3129;
  --f-display:"Special Elite","Courier New",monospace;
  --f-text:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}

/* üst bant */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{font-family:var(--f-display);font-size:13px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
.case-title{font-family:var(--f-display);font-size:clamp(26px,4.4vw,40px);line-height:1.1;margin:4px 0 0;text-wrap:balance;font-weight:400}
.case-title small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.06em;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-variant-numeric:tabular-nums;font-size:13px;border:1px solid var(--line);padding:5px 10px;border-radius:3px;background:var(--desk-2);white-space:nowrap}
.chip b{color:var(--brass);font-weight:600}

/* sekmeler */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 22px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:none;border:1px solid transparent;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:14px;letter-spacing:.02em}
.tab span{font-family:var(--f-display);color:var(--brass);margin-right:6px;opacity:.8}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--string)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}

/* kâğıt */
.paper{background:var(--paper);color:var(--ink);border-radius:2px;box-shadow:0 1px 0 #0003,0 14px 30px -12px #000a;position:relative}
.paper .pad{padding:clamp(18px,3.4vw,36px)}
.label{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.dark .label,.label.on-desk{color:var(--muted)}
h2.h{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,2.6vw,26px);margin:6px 0 12px;text-wrap:balance}
.prose{font-family:var(--f-text);font-size:17.5px;line-height:1.72;max-width:66ch}
.prose p{margin:0 0 1em}
.muted{color:var(--muted)}
.ink-soft{color:var(--ink-soft)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid-2{grid-template-columns:minmax(0,1fr)}}

.stamp{position:absolute;right:18px;top:18px;font-family:var(--f-display);color:var(--string);border:2px solid var(--string);padding:3px 10px;transform:rotate(-6deg);font-size:13px;letter-spacing:.12em;opacity:.85}

.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--brass);background:transparent;color:var(--brass);padding:9px 16px;border-radius:3px;font-weight:500;letter-spacing:.02em}
.btn:hover{background:#c9a45c1a}
.btn.solid{background:var(--brass);color:#1a1712}
.btn.solid:hover{background:#d8b56c}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.paper .btn{border-color:var(--ink);color:var(--ink)}
.paper .btn.solid{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* öykü ipuçları */
.c{cursor:zoom-in;border-radius:2px;transition:background .15s}
.c:hover{background:#c63b2f14}
.c.found{cursor:default;background:linear-gradient(transparent 60%,#c63b2f40 60%)}
.c.flash{animation:flash 2.4s ease}
@keyframes flash{0%,100%{background:transparent}20%,70%{background:#c9a45c66}}
.story-title{font-family:var(--f-display);font-size:22px;margin:4px 0 18px;font-weight:400}

/* defter */
.notebook{background:var(--desk-2);border:1px solid var(--line);border-radius:3px;padding:16px;position:sticky;top:12px}
.nb-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.slips{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.slip{background:var(--paper);color:var(--ink);padding:8px 10px;border-radius:2px;font-size:14px;line-height:1.35;display:grid;gap:3px}
.slip .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);padding:14px;border-radius:3px}

/* sorgu */
.suspects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.suspects{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sus{background:var(--desk-2);border:1px solid var(--line);border-radius:3px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.sus:hover{border-color:#4a5568}
.sus[aria-pressed="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.sus .nm{font-family:var(--f-display);font-size:17px}
.sus .rl{font-size:13px;color:var(--muted)}
.sus .cnt{font-size:12px;color:var(--brass);font-variant-numeric:tabular-nums}
.qs{display:grid;gap:8px;margin:14px 0}
.q{text-align:left;background:transparent;border:1px solid #0000002a;border-radius:2px;padding:9px 12px;cursor:pointer;font-family:var(--f-text);font-size:16px;color:var(--ink)}
.q:hover{background:#0000000a}
.q[disabled]{opacity:.45;cursor:default}
.transcript{display:grid;gap:12px;border-top:1px dashed #00000033;padding-top:14px}
.tr-q{font-family:var(--f-display);font-size:13px;color:var(--ink-soft)}
.tr-a{font-family:var(--f-text);font-size:17px;line-height:1.6}
.tr-a .newclue{display:inline-block;margin-top:4px;font-family:var(--f-ui);font-size:12px;color:var(--string);letter-spacing:.06em;text-transform:uppercase}

/* seçenekler */
.opts{display:grid;gap:8px;margin:10px 0 18px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #00000026;border-radius:2px;cursor:pointer;font-family:var(--f-text);font-size:16px;line-height:1.45}
.opt:hover{background:#00000008}
.opt input{margin-top:5px;accent-color:var(--string)}
.opt.right{border-color:#4f7d48;background:#4f7d4814}
.opt.wrong{border-color:var(--string);background:#c63b2f10}
textarea{width:100%;min-height:120px;font-family:var(--f-text);font-size:16px;line-height:1.55;padding:12px;border:1px solid #00000033;border-radius:2px;background:#fffaf0;color:var(--ink);resize:vertical}
.fb{font-size:15px;padding:10px 12px;border-radius:2px;margin-top:8px}
.fb.ok{background:#4f7d481c;color:#2f4f2a}
.fb.no{background:#c63b2f14;color:#7d241c}

/* pano */
.board-wrap{display:grid;gap:12px}
.board{position:relative;height:620px;border-radius:3px;overflow:hidden;touch-action:none;
  background:
   radial-gradient(circle at 20% 30%,#ffffff07 0 1px,transparent 2px) 0 0/9px 9px,
   radial-gradient(circle at 70% 60%,#00000030 0 1px,transparent 2px) 0 0/7px 7px,
   radial-gradient(ellipse at 50% 40%,var(--cork-2),var(--cork) 75%);
  box-shadow:inset 0 0 0 10px #1f1a15,inset 0 0 60px #0009}
@media (max-width:600px){.board{height:680px}}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:absolute;transform:translate(-50%,-50%);width:138px;background:var(--paper);color:var(--ink);font-size:12.5px;line-height:1.3;padding:14px 9px 9px;border-radius:2px;box-shadow:0 6px 14px -4px #000c;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.card::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7d,var(--string) 60%,#7e1f17);box-shadow:0 2px 2px #0007}
.card .tg{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.card.sel{outline:3px solid var(--brass);outline-offset:2px}
.card.dragging{cursor:grabbing;z-index:5;box-shadow:0 14px 26px -6px #000e}
.card.center{width:150px;background:#1a1610;color:var(--brass);border:1px solid var(--brass);text-align:center;font-family:var(--f-display);font-size:14px;padding:16px 8px 12px;cursor:pointer}
.card.center .tg{color:var(--muted)}
@media (max-width:600px){.card{width:108px;font-size:11.5px;padding:13px 7px 7px}.card.center{width:118px;font-size:12.5px}}
.picker{background:var(--desk-2);border:1px solid var(--line);border-radius:3px;padding:12px}
.picker .row .btn{padding:7px 12px;font-size:14px}
.conns{display:grid;gap:8px}
.conn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--desk-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.grade{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;font-weight:600}
.g-ustaca{background:var(--brass);color:#1a1712}
.g-guclu{background:#c63b2f;color:#fff3ef}
.g-zayif{background:#3a4352;color:var(--fg)}
.g-yetersiz{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.conn .pair{font-size:14px}
.conn .why{font-size:14px;color:var(--muted);margin-top:2px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.x:hover{color:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}

/* sonuç */
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
@media (max-width:700px){.verdict{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vbox{border:1px solid #00000022;padding:10px;border-radius:2px}
.vbox .n{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.vbox .t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.rank{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);color:var(--string)}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:12px 0}
@media (max-width:700px){.compare{grid-template-columns:minmax(0,1fr)}}
.compare > div{border:1px solid #00000022;padding:12px;border-radius:2px;font-family:var(--f-text);font-size:16px}
.epilog{border-left:3px solid var(--string);padding-left:16px;margin:18px 0}
pre.summary{white-space:pre-wrap;font-size:13px;background:#00000010;padding:12px;border-radius:2px;max-height:240px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:3px;box-shadow:0 10px 30px #000b;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:min(520px,calc(100vw - 32px));border-left:4px solid var(--string)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Kurmaca Bürosu · Vaka 01</div>
      <h1 class="case-title">Dokuzu Yirmi Geçe<small>Okur dedektif, ayrıntı ipucu, gizli merkez dava.</small></h1>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Soruşturma adımları"></nav>
  <main id="view"></main>
  <footer>
    <span>Öykü ve vaka bu oyun için özgün yazılmıştır. Yeni vaka eklemek için koddaki <code>CASE</code> nesnesini çoğaltın.</span>
    <span id="resetZone"><button class="btn ghost" data-act="askReset">Vakayı sıfırla</button></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= VAKA VERİSİ ================= */
const TYPES={leitmotif:"Leitmotif / İmge",metafor:"Metafor",mekan:"Mekân",diyalog:"Diyalog",zaman:"Zaman",kanit:"Kanıt"};
const GRADES={ustaca:"Ustaca",guclu:"Güçlü",zayif:"Zayıf",yetersiz:"Kanıt yetersiz"};

const CASE={
  title:"Dokuzu Yirmi Geçe",
  brief:[
    "Sahil yokuşundaki saatçi dükkânından bir gümüş cep saati kayboldu. Kapı zorlanmamış, kilit sağlam.",
    "Olayı anlatan, dükkânın çırağı Umut. Onun anlattıklarını oku, ayrıntıları topla, tanıkları sorgula ve ipuçlarını panoda birbirine bağla.",
    "Bu bürodaki her dava iki soru taşır: <b>Ne oldu?</b> ve <b>Bu öykü aslında ne anlatıyor?</b> Birincisini çözen iyi bir polistir. İkincisini çözen, iyi bir okurdur."
  ],
  flatReader:"“Bir saatçinin değerli saati çalınmış. Elleri hep kirli olan çırak almıştır, zaten anahtarını da kaybetmişti. Öykü bitti.”",
  story:[
    "Nevzat Usta'nın dükkânında saatler hiç susmazdı ama hiçbiri doğruyu söylemezdi. Vitrindeki duvar saatleri, masa saatleri, camı çatlamış kol saatleri, [[saatler|hepsi dokuzu yirmi geçeyi gösterirdi]]. Usta onları her sabah kurar, sonra akrebi yine aynı yere çekerdi. Nedenini sormadım. Üç yıldır çırağıyım; bazı soruların cevabını sormadan öğrenirsin.",
    "Perşembe sabahı dükkânı ben açtım. Yokuşun başında [[marti|martılar balıkçı kasalarının üstünde kavga ediyordu]], havada her zamanki [[koku|tuz ve mazot kokusu]] vardı. Kış gelmişti; [[tekne|kıyıya çekilmiş teknelerin brandaları rüzgârda şişiyordu]]. Kepengi kaldırdım, ışığı yaktım ve [[yastik|vitrinin ortasındaki kadife yastığın boş olduğunu]] gördüm.",
    "O yastıkta Usta'nın rahmetli karısı Mürüvvet Hanım'ın gümüş cep saati dururdu. Satılık değildi. Fiyat etiketinin yerinde [[kart|Usta'nın el yazısıyla “Bu saat çalışmaz” yazan küçük bir kart]] vardı. Dükkândaki tek gerçekten durmuş saat oydu. Öbürlerini Usta durduruyordu; onu ise kimse çalıştıramamıştı.",
    "Kapıda zorlama yoktu, kilit sağlamdı. [[anahtar|Dükkânın anahtarı yalnızca iki kişide vardı: Usta'da ve bir hafta önce İstanbul'dan gelen oğlu Kenan'da.]] Benim anahtarım geçen ay kaybolmuştu, Usta yenisini yaptırmamıştı. Sabahları onun evine uğrayıp anahtarı oradan alırdım. O sabah da öyle yapmıştım.",
    "Usta geldiğinde boş yastığa uzun uzun baktı. Bağırmadı. [[durdum|“O saat durdu, ben de durdum,” dedi. “Kim aldıysa zamanımı almış olur.”]] Sonra tezgâhın arkasına geçti, lupunu taktı ve hiçbir şey olmamış gibi bir kol saatini sökmeye başladı.",
    "Öğleye doğru Kenan geldi. [[otobus|Gece geç saatte şehirden dönen son otobüsle gelmişti]], gözlerinin altı mordu. Babasına sarılmadı, vitrine baktı. “Polise haber verelim,” dedi. Usta başını kaldırmadı. Kenan bana döndü: [[hapsetti|“Babam bu dükkânda zamanı hapsetti, Umut. Dokuzu yirmi geçe. Annemin öldüğü saat.”]]",
    "Karşıdaki fırının sahibi Selma Abla akşamüstü çay getirdi. Kulağıma eğildi: [[dogumgunu|“Cuma Nevzat'ın doğum günü, yetmiş olacak. Mürüvvet her yıl o saati kurup ona hediye ederdi. Şaka gibi, her yıl aynı hediye.”]] Sonra güldü ama gözleri dolmuştu.",
    "Akşam dükkânı kapatırken Kenan'ın askıda unuttuğu montunu gördüm. Cebinden bir kâğıt sarkıyordu. Almadım, okumadım da. Ama [[fis|ucunda “Onarım fişi” yazdığını]] seçtim. Ellerime baktım; [[eller|parmaklarım her zamanki gibi saat yağından kapkaraydı]]. Beni ilk suçlayacakları bu ellerdi, biliyordum.",
    "Eve yürürken saatime baktım. [[umutsaat|Benimki de dokuzu yirmi geçeyi gösteriyordu.]] Ne zaman durduğunu hatırlamıyordum."
  ],
  clues:{
    saatler:{label:"Bütün saatler 9.20'yi gösteriyor",tag:"leitmotif"},
    marti:{label:"Martılar, balıkçı kasaları",tag:"mekan"},
    koku:{label:"Tuz ve mazot kokusu",tag:"mekan"},
    tekne:{label:"Kışa kıyıya çekilmiş tekneler",tag:"mekan"},
    yastik:{label:"Vitrinde boş kalan kadife yastık",tag:"metafor"},
    kart:{label:"“Bu saat çalışmaz” kartı",tag:"metafor"},
    anahtar:{label:"Anahtar yalnızca Usta'da ve Kenan'da",tag:"kanit"},
    durdum:{label:"Usta: “O saat durdu, ben de durdum.”",tag:"diyalog"},
    otobus:{label:"Kenan gece son otobüsle şehirden döndü",tag:"zaman"},
    hapsetti:{label:"Kenan: “Babam zamanı hapsetti.”",tag:"diyalog"},
    dogumgunu:{label:"Cuma: Usta'nın 70. doğum günü, Mürüvvet'in her yılki hediyesi",tag:"zaman"},
    fis:{label:"Kenan'ın montunda “Onarım fişi”",tag:"kanit"},
    eller:{label:"Umut'un saat yağıyla kararmış elleri",tag:"kanit"},
    umutsaat:{label:"Umut'un saati de 9.20'de durmuş",tag:"leitmotif"},
    kurmadi:{label:"Usta saati onarabilirdi ama onarmadı",tag:"diyalog",src:"sorgu"},
    surcme:{label:"Kenan: “Bir saatçiye... yani bir tanıdığa uğradım.”",tag:"diyalog",src:"sorgu"},
    kutu:{label:"Kenan sabah otobüse mendile sarılı bir kutuyla bindi",tag:"kanit",src:"sorgu"},
    anlatici:{label:"Anlatıcı fişi gördü ama okumadı",tag:"diyalog",src:"sorgu"}
  },
  suspects:[
    {id:"usta",name:"Nevzat Usta",role:"Saatçi, saatin sahibi",qs:[
      {q:"Saat en son ne zaman yerindeydi?",a:"Dün akşam kepengi ben indirdim. Yerindeydi. Her akşam bakarım."},
      {q:"O saati kim onarabilirdi?",a:"Ben. Bu kasabada o mekanizmayı benden iyi bilen yok. Ama onarmadım. Onu Mürüvvet kurardı, ben değil.",clue:"kurmadi"},
      {q:"Neden dükkândaki bütün saatler 9.20'de?",a:"(Uzun bir sessizlik. Lupu gözünden çıkarmıyor.) Saati sormak için bir saatçiye mi geldin, evlat?"}
    ]},
    {id:"kenan",name:"Kenan",role:"Usta'nın oğlu, İstanbul'dan geldi",qs:[
      {q:"Dün bütün gün neredeydin?",a:"Şehirdeydim. Bir iş görüşmem vardı. Sonra bir saatçiye... yani bir tanıdığa uğradım. Son otobüsle döndüm.",clue:"surcme"},
      {q:"Babanla aranız nasıl?",a:"Annem öldüğünden beri o dükkânda konuşulan tek dil tik-tak. O da durmuş bir tik-tak."},
      {q:"Anahtarın şu an nerede?",a:"Cebimde. (Ceplerini yokluyor, montunu dükkânda unuttuğunu hatırlıyor.) Yani... montumda."}

/* ================= DURUM ================= */
const KEY="kurmaca-burosu-v1";
const fresh=()=>({view:"dosya",found:{},asked:{},conns:[],pos:{},sel:null,pending:null,activeSus:"usta",loc:{ans:null,ev:[],done:false},fin:{who:null,ev:[],why:null,center:null,report:""},solved:false,hints:0,start:Date.now()});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
if(window.claude?.hot?.data?.S) S=window.claude.hot.data.S;
window.claude?.hot?.snapshot?.(()=>({S}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CLUE_IDS=Object.keys(CASE.clues);
const foundIds=()=>CLUE_IDS.filter(id=>S.found[id]);

function toast(msg){const t=$("#toast");t.innerHTML=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600);}

function addClue(id){
  if(S.found[id])return false;
  S.found[id]=Date.now();
  // panoda ilk konum: merkez etrafında halka
  const i=CLUE_IDS.indexOf(id),n=CLUE_IDS.length,ang=(i/n)*Math.PI*2-Math.PI/2;
  S.pos[id]={x:50+Math.cos(ang)*38,y:50+Math.sin(ang)*38};
  save();renderChips();
  toast("<b>Deftere eklendi:</b> "+esc(CASE.clues[id].label));
  return true;
}

/* ================= ÜST BANT / SEKMELER ================= */
const STEPS=[["dosya","Dosya"],["olay","Olay Yeri"],["sorgu","Sorgu"],["konum","Konum"],["pano","Pano"],["sucla","Suçlama"]];
function fmtTime(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function renderChips(){
  const g=S.conns.filter(c=>c.grade==="ustaca"||c.grade==="guclu").length;
  $("#chips").innerHTML=`<span class="chip">İpucu <b>${foundIds().length}/${CLUE_IDS.length}</b></span><span class="chip">Bağlantı <b>${g}</b></span><span class="chip">Süre <b id="clock">${fmtTime(Date.now()-S.start)}</b></span>`;
}
function renderTabs(){
  const done={dosya:true,olay:CASE.story.join("").match(/\[\[/g).length===CLUE_IDS.filter(i=>!CASE.clues[i].src&&S.found[i]).length,sorgu:CLUE_IDS.filter(i=>CASE.clues[i].src&&S.found[i]).length===4,konum:S.loc.done,pano:S.conns.length>=5,sucla:S.solved};
  $("#tabs").innerHTML=STEPS.map(([id,t],i)=>`<button class="tab" data-act="go" data-v="${id}" ${S.view===id?'aria-current="page"':""}><span>${i+1}</span>${t}${done[id]&&id!=="dosya"?'<i class="dot" aria-label="tamam"></i>':""}</button>`).join("");
}
setInterval(()=>{const c=$("#clock");if(c)c.textContent=fmtTime(Date.now()-S.start);},1000);

     :S.sel?`<div class="picker" style="font-size:14px">Seçili: <b>${esc(nameOf(S.sel))}</b>. Şimdi bağlamak istediğin ikinci karta dokun. <button class="btn ghost" data-act="cancel" style="margin-left:8px;padding:4px 10px">Seçimi bırak</button></div>`:""}
   <div class="label on-desk" style="margin-top:6px">Kurulan bağlar (${S.conns.length})</div>
   ${S.conns.length?`<div class="conns">${S.conns.slice().reverse().map(c=>`<div class="conn"><span class="grade g-${c.grade}">${GRADES[c.grade]}</span><div style="min-width:0"><div class="pair">${esc(nameOf(c.a))} ↔ ${esc(nameOf(c.b))} <span class="muted">· ${TYPES[c.type]}</span></div><div class="why">${esc(c.text)}</div></div><button class="x" data-act="delc" data-k="${c.a}|${c.b}" aria-label="Bağı kaldır">×</button></div>`).join("")}</div>`:`<div class="empty">Henüz ip gerilmedi.</div>`}
   <div class="row" style="margin-top:6px"><button class="btn solid" data-act="go" data-v="sucla">Suçlama odasına geç</button></div>
  </div>`;
}
const nameOf=id=>id==="merkez"?"Gizli merkez":CASE.clues[id].label;

function vSucla(){
  const F=CASE.final,ids=foundIds();
  if(S.solved) return vSonuc();
  const warn=ids.length<8||S.conns.length<3;
  const radios=(name,q)=>`<div class="opts">${q.options.map(o=>`<label class="opt"><input type="radio" name="${name}" id="${name}-${o.id}" value="${o.id}" ${S.fin[name]===o.id?"checked":""}> ${o.t}</label>`).join("")}</div>`;
  return `<article class="paper" style="max-width:860px"><div class="pad">
    <div class="label">Suçlama odası</div>
    <h2 class="h">Dosyayı kapatmadan önce</h2>
    ${warn?`<div class="fb no" style="margin-bottom:14px">Defterinde ${ids.length} delil, panoda ${S.conns.length} bağ var. Erken suçlama yapabilirsin ama iyi bir dedektif en az 8 delil ve 3 bağla gelir.</div>`:""}
    <div class="label" style="margin-top:6px">1 · ${F.who.q}</div>${radios("who",F.who)}
    <div class="label">2 · Suçlamanı hangi delillerle destekliyorsun? (en fazla 4)</div>
    <div class="opts">${ids.map(id=>`<label class="opt"><input type="checkbox" name="finev" id="finev-${id}" value="${id}" ${S.fin.ev.includes(id)?"checked":""}> ${esc(CASE.clues[id].label)}</label>`).join("")||'<span class="ink-soft">Defterin boş.</span>'}</div>
    <div class="label">3 · ${F.why.q}</div>${radios("why",F.why)}
    <div class="label">4 · ${F.center.q}</div>${radios("center",F.center)}
    <div class="label">5 · Dedektif raporu: gizli merkezi kendi cümlelerinle yaz (2-4 cümle)</div>
    <textarea id="report" placeholder="Bu öyküde asıl çözülen şey…">${esc(S.fin.report)}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn solid" data-act="accuse">Dosyayı kapat ve açıkla</button><span id="accuseMsg" class="ink-soft" style="font-size:14px"></span></div>
  </div></article>`;
}

function score(){
  const F=CASE.final;let pts=0,max=0;
  const clues=foundIds().length;pts+=clues;max+=CLUE_IDS.length;
  const best={};S.conns.forEach(c=>{const v={ustaca:3,guclu:2,zayif:0,yetersiz:0}[c.grade];pts+=v;});
  max+=24;
  const L=CASE.location;if(S.loc.done){if(S.loc.ans===L.answer)pts+=2;pts+=S.loc.ev.filter(e=>L.evidence.includes(e)).length;}max+=5;
  const whoOk=S.fin.who===F.who.answer;if(whoOk)pts+=3;max+=3;
  const evOk=S.fin.ev.filter(e=>F.evidence.includes(e)).length;pts+=evOk;max+=4;
  const whyOk=S.fin.why===F.why.answer;if(whyOk)pts+=3;max+=3;
  const cOpt=F.center.options.find(o=>o.id===S.fin.center);const cPts={ustaca:4,guclu:3,zayif:1,duz:0}[cOpt?.grade]||0;pts+=cPts;max+=4;
  const rep=S.fin.report.trim().length>=60;if(rep)pts+=2;max+=2;
  pts=Math.min(pts,max);
  const ratio=pts/max;
  const rank=ratio>=.75?"Düşünceli Okur":ratio>=.5?"Dikkatli Okur":"Düz Okur";
  const rankNote=ratio>=.75?"Hem olayı çözdün hem de öykünün nereye aktığını gördün. Orhan Pamuk'un deyişiyle hem saf hem düşünceli okursun.":ratio>=.5?"Olayın izini sürdün. Bir adım daha: delillerin ne olduğunu değil, ne anlama geldiğini sor.":"Olay örgüsünü takip ettin. Panoya dön; ayrıntılar arasındaki iplikler seni merkeze götürecek.";
  return {pts,max,clues,whoOk,evOk,whyOk,cOpt,rep,rank,rankNote,ustaca:S.conns.filter(c=>c.grade==="ustaca").length,guclu:S.conns.filter(c=>c.grade==="guclu").length};
}

function summaryText(r){
  const F=CASE.final;
  return [
    `KURMACA BÜROSU · ${CASE.title}`,
    `Unvan: ${r.rank} (${r.pts}/${r.max} puan)`,
    `Süre: ${fmtTime((S.solvedAt||Date.now())-S.start)} · Büyüteç: ${S.hints}`,
    `Delil: ${r.clues}/${CLUE_IDS.length}`,
    `Bağlar: ${S.conns.length} (ustaca ${r.ustaca}, güçlü ${r.guclu})`,
    `Konum: ${S.loc.done?(S.loc.ans===CASE.location.answer?"doğru":"yanlış"):"yapılmadı"}`,
    `Suçlu: ${F.who.options.find(o=>o.id===S.fin.who)?.t||"-"} (${r.whoOk?"doğru":"yanlış"})`,
    `Neden: ${F.why.options.find(o=>o.id===S.fin.why)?.t||"-"}`,
    `Gizli merkez: ${r.cOpt?.t||"-"}`,
    `Rapor: ${S.fin.report.trim()||"-"}`,
    `Bağ listesi:`,
    ...S.conns.map(c=>`  - [${GRADES[c.grade]}] ${nameOf(c.a)} <-> ${nameOf(c.b)} (${TYPES[c.type]})`)
  ].join("\n");
}

function vSonuc(){
  const r=score(),F=CASE.final;
  return `<article class="paper" style="max-width:900px"><div class="pad">
    <span class="stamp">DOSYA KAPANDI</span>
    <div class="label">Sonuç</div>
    <div class="rank" style="margin:8px 0 4px">${r.rank}</div>
    <p class="prose" style="margin:0 0 6px">${r.rankNote}</p>
    <div class="verdict">
      <div class="vbox"><div class="n">${r.pts}/${r.max}</div><div class="t">Puan</div></div>
      <div class="vbox"><div class="n">${r.clues}/${CLUE_IDS.length}</div><div class="t">Delil</div></div>
      <div class="vbox"><div class="n">${r.ustaca}</div><div class="t">Ustaca bağ</div></div>
      <div class="vbox"><div class="n">${fmtTime((S.solvedAt||Date.now())-S.start)}</div><div class="t">Süre</div></div>
    </div>
    <div class="fb ${r.whoOk?"ok":"no"}"><b>Suçlu:</b> ${r.whoOk?"Doğru. Saati Kenan aldı.":"Saati Kenan aldı."} Destekleyen delillerinden ${r.evOk} tanesi isabetli.</div>
    <div class="fb ${r.whyOk?"ok":"no"}"><b>Neden:</b> ${r.whyOk?"Doğru.":""} Kenan saati çalmadı; annesinin her yıl yaptığı gibi, babasının doğum gününde onu yeniden kurmak için onarıma götürdü.</div>
    ${r.cOpt?`<div class="fb ${r.cOpt.grade==="ustaca"||r.cOpt.grade==="guclu"?"ok":"no"}"><b>Gizli merkez (${({ustaca:"ustaca",guclu:"güçlü",zayif:"zayıf",duz:"düz okuma"})[r.cOpt.grade]}):</b> ${r.cOpt.note}</div>`:""}
    <div class="label" style="margin-top:22px">Epilog · Cuma</div>
    <div class="epilog prose">${CASE.epilog.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="label">Düz okur ve sen</div>
    <div class="compare">
      <div><div class="label">Düz Okur</div><p style="margin:6px 0 0;font-style:italic">${CASE.flatReader}</p></div>
      <div><div class="label">Senin raporun</div><p style="margin:6px 0 0">${esc(S.fin.report.trim()||"(Rapor yazılmadı.)")}</p></div>
    </div>
    <div class="label" style="margin-top:18px">Öğretmen için dosya özeti</div>
    <pre class="summary" id="sumText">${esc(summaryText(r))}</pre>
    <div class="row" style="margin-top:10px"><button class="btn solid" data-act="copy">Özeti kopyala</button><button class="btn" data-act="reopen">Suçlamayı yeniden düşün</button><button class="btn" data-act="go" data-v="pano">Panoya dön</button></div>
  </div></article>`;
}

/* ================= ÇİZİM ================= */
function render(){
  renderChips();renderTabs();
  const V={dosya:vDosya,olay:vOlay,sorgu:vSorgu,konum:vKonum,pano:vPano,sucla:vSucla}[S.view]||vDosya;
  $("#view").innerHTML=V();
  if(S.view==="pano")requestAnimationFrame(drawStrings);
}

function cardCenter(id,w,h){
  if(id==="merkez")return{x:w/2,y:h/2};
  const p=S.pos[id]||{x:50,y:50};return{x:p.x/100*w,y:p.y/100*h};
}
function drawStrings(){
  const b=$("#board"),svg=$("#strings");if(!b||!svg)return;
  const w=b.clientWidth,h=b.clientHeight;svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  const narrow=w<600;
  svg.innerHTML=S.conns.map(c=>{
    const p1=cardCenter(c.a,w,h),p2=cardCenter(c.b,w,h);
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,d=Math.hypot(p2.x-p1.x,p2.y-p1.y),sag=Math.min(60,d*.12);
    const st={ustaca:'stroke="var(--brass)" stroke-width="3.2"',guclu:'stroke="var(--string)" stroke-width="2.6"',zayif:'stroke="#9b4b44" stroke-width="1.8" stroke-dasharray="6 5"',yetersiz:'stroke="#8f97a5" stroke-width="1.4" stroke-dasharray="3 5"'}[c.grade];
    const lbl=narrow?"":`<text x="${mx}" y="${my+sag*.5-6}" text-anchor="middle" font-size="11" fill="#ece6d7" stroke="#1d1813" stroke-width="3" paint-order="stroke" font-family="IBM Plex Sans Condensed, sans-serif">${esc(TYPES[c.type])}</text>`;
    return `<path d="M${p1.x} ${p1.y} Q${mx} ${my+sag} ${p2.x} ${p2.y}" fill="none" ${st} stroke-linecap="round" opacity=".95"/>${lbl}`;
  }).join("");
}
addEventListener("resize",()=>{if(S.view==="pano")drawStrings();});

/* ================= PANO ETKİLEŞİM ================= */
let drag=null;
document.addEventListener("pointerdown",e=>{
  const card=e.target.closest(".card");if(!card)return;
  const id=card.dataset.card;
  drag={id,card,sx:e.clientX,sy:e.clientY,moved:false};
  if(id!=="merkez")card.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!drag||drag.id==="merkez")return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
  drag.moved=true;drag.card.classList.add("dragging");
  const r=$("#board").getBoundingClientRect();
  const x=Math.max(7,Math.min(93,(e.clientX-r.left)/r.width*100)),y=Math.max(6,Math.min(94,(e.clientY-r.top)/r.height*100));
  S.pos[drag.id]={x,y};drag.card.style.left=x+"%";drag.card.style.top=y+"%";drawStrings();
});
document.addEventListener("pointerup",()=>{
  if(!drag)return;const d=drag;drag=null;d.card.classList.remove("dragging");
  if(d.moved){save();return;}
  pickCard(d.id);
});
function pickCard(id){
  if(S.pending)return;
  if(!S.sel){S.sel=id;}
  else if(S.sel===id){S.sel=null;}
  else{
    const a=S.sel,b=id;
    if(S.conns.some(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a))){toast("Bu iki kart zaten bağlı.");S.sel=null;}
    else S.pending=[a,b];
  }
  save();render();
}
function evalConn(a,b,type){
  if(a==="merkez"||b==="merkez"){
    const o=a==="merkez"?b:a;
    if(CASE.centerFlow.includes(o))return{grade:"guclu",text:"Bu ayrıntı merkeze akıyor; olayı değil, anlamı taşıyor."};
    return{grade:"zayif",text:"Bu delil olayı çözer (kim, nasıl) ama gizli merkezi taşımaz. Delil ile anlamı ayır."};
  }
  const L=CASE.links.find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  if(!L){
    if(a==="eller"||b==="eller")return{grade:"zayif",text:CASE.redHerring};
    return{grade:"yetersiz",text:"Kanıt yetersiz. Metinde bu iki ayrıntıyı bağlayan bir köprü görünmüyor. İstersen panoda kalsın; raporunda savunabilirsin."};
  }
  if(L.types.includes(type))return{grade:L.grade,text:L.text};
  return{grade:L.grade==="ustaca"?"guclu":"zayif",text:L.text+" Bağ yerinde, ama tür olarak "+L.types.map(t=>TYPES[t]).join(" / ")+" daha uygun."};
}

/* ================= OLAYLAR ================= */
function collectForm(){
  if(S.view==="konum"&&!S.loc.done){
    const r=document.querySelector('input[name="loc"]:checked');S.loc.ans=r?r.value:null;
    S.loc.ev=[...document.querySelectorAll('input[name="locev"]:checked')].map(i=>i.value);
  }
  if(S.view==="sucla"&&!S.solved){
    ["who","why","center"].forEach(n=>{const r=document.querySelector(`input[name="${n}"]:checked`);S.fin[n]=r?r.value:S.fin[n];});
    S.fin.ev=[...document.querySelectorAll('input[name="finev"]:checked')].map(i=>i.value);
    const t=$("#report");if(t)S.fin.report=t.value;
  }
}
document.addEventListener("change",e=>{
  if(e.target.name==="finev"){
    const on=document.querySelectorAll('input[name="finev"]:checked');
    if(on.length>4){e.target.checked=false;toast("En fazla 4 delil seçebilirsin.");}
  }
  collectForm();save();
});
document.addEventListener("input",e=>{if(e.target.id==="report"){S.fin.report=e.target.value;save();}});

function clueClick(el){
  const id=el.dataset.c;if(S.found[id])return;
  addClue(id);el.classList.add("found");el.removeAttribute("tabindex");el.removeAttribute("role");
  renderTabs();
  // defteri tazele
  const nb=document.querySelector(".notebook");if(nb)nb.outerHTML=notebook();
  const left=CLUE_IDS.filter(i=>!CASE.clues[i].src&&!S.found[i]).length;
  if(!left){render();toast("Metindeki bütün ayrıntıları buldun. Sıra sorguda.");}
}

document.addEventListener("click",e=>{
  const c=e.target.closest(".c");if(c){clueClick(c);return;}
  const t=e.target.closest("[data-act]");if(!t)return;
  const act=t.dataset.act;
  if(act==="go"){collectForm();S.view=t.dataset.v;S.sel=null;S.pending=null;save();render();scrollTo({top:0,behavior:"smooth"});}
  else if(act==="hint"){
    const id=CLUE_IDS.find(i=>!CASE.clues[i].src&&!S.found[i]);if(!id)return;
    const el=document.querySelector(`.c[data-c="${id}"]`);S.hints++;save();
    el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");el.scrollIntoView({block:"center",behavior:"smooth"});
  }
  else if(act==="sus"){S.activeSus=t.dataset.id;save();render();}
  else if(act==="ask"){
    const s=CASE.suspects.find(x=>x.id===S.activeSus),i=+t.dataset.i;
    S.asked[s.id]=[...(S.asked[s.id]||[]),i];
    if(s.qs[i].clue)addClue(s.qs[i].clue);
    save();render();
  }
  else if(act==="locCheck"){
    collectForm();
    if(!S.loc.ans){toast("Önce bir mekân seç.");return;}
    if(!S.loc.ev.length){toast("Tespitini en az bir delille destekle.");return;}
    S.loc.done=true;save();render();
  }
  else if(act==="ctype"){
    const [a,b]=S.pending,res=evalConn(a,b,t.dataset.t);
    S.conns.push({a,b,type:t.dataset.t,grade:res.grade,text:res.text,at:Date.now()});
    S.pending=null;S.sel=null;save();render();
    toast(`<b>${GRADES[res.grade]}.</b> ${esc(res.text)}`);
  }
  else if(act==="cancel"){S.pending=null;S.sel=null;save();render();}
  else if(act==="delc"){const [a,b]=t.dataset.k.split("|");S.conns=S.conns.filter(c=>!(c.a===a&&c.b===b));save();render();}
  else if(act==="accuse"){
    collectForm();
    const miss=[];if(!S.fin.who)miss.push("suçlu");if(!S.fin.why)miss.push("neden");if(!S.fin.center)miss.push("gizli merkez");
    if(miss.length){$("#accuseMsg").textContent="Eksik: "+miss.join(", ")+".";return;}
    S.solved=true;S.solvedAt=Date.now();save();render();scrollTo({top:0,behavior:"smooth"});
  }
  else if(act==="reopen"){S.solved=false;save();render();}
  else if(act==="copy"){
    const txt=$("#sumText").textContent;
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#sumText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Metni seçtim; kopyalamak için Ctrl+C / Kopyala.");};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Özet kopyalandı."),fallback);}catch(err){fallback();}
  }
  else if(act==="askReset"){$("#resetZone").innerHTML='<span>Bütün ilerleme silinsin mi?</span> <button class="btn" data-act="doReset" style="padding:5px 10px">Evet, sıfırla</button> <button class="btn ghost" data-act="noReset" style="padding:5px 10px">Vazgeç</button>';}
  else if(act==="noReset"){$("#resetZone").innerHTML='<button class="btn ghost" data-act="askReset">Vakayı sıfırla</button>';}
  else if(act==="doReset"){S=fresh();save();$("#resetZone").innerHTML='<button class="btn ghost" data-act="askReset">Vakayı sıfırla</button>';render();toast("Vaka sıfırlandı.");}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const c=e.target.closest(".c[tabindex]");if(c){e.preventDefault();clueClick(c);return;}
  const card=e.target.closest(".card");if(card){e.preventDefault();pickCard(card.dataset.card);}
});

render();
</script>
